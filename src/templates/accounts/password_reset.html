{% extends "public.html" %}
{% block content %}
<h1 class="h4 mb-3">Reset password</h1>
<form method="post" novalidate>{% csrf_token %}
  {% for field in form %}{% include "components/_form_field.html" %}{% endfor %}
  <button class="btn btn-primary w-100">Email me a reset link</button>
</form>
<div class="mt-3 small"><a href="{% url 'accounts:login' %}">Back to sign in</a></div>
{% endblock %}
