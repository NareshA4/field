{% extends "shell.html" %}
{% block title %}My profile · FieldOps Nexus{% endblock %}
{% block content %}
<div class="fx-page-header"><h1>My profile</h1><a class="btn btn-outline-secondary" href="{% url 'accounts:password_change' %}">Change password</a></div>
<div class="fx-card" style="max-width:520px"><div class="fx-card-body">
<p class="text-body-secondary mb-3">Signed in as <strong>{{ request.user.email }}</strong></p>
<form method="post" novalidate>{% csrf_token %}
  {% for field in form %}{% include "components/_form_field.html" %}{% endfor %}
  <button class="btn btn-primary">Save</button>
</form></div></div>
{% endblock %}
