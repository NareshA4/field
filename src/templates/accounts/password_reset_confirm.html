{% extends "public.html" %}
{% block content %}
{% if validlink %}
<h1 class="h4 mb-3">Choose a new password</h1>
<form method="post" novalidate>{% csrf_token %}
  {% for field in form %}{% include "components/_form_field.html" %}{% endfor %}
  <button class="btn btn-primary w-100">Update password</button>
</form>
{% else %}
<h1 class="h4">Link expired or invalid</h1><a href="{% url 'accounts:password_reset' %}">Request a new link</a>
{% endif %}
{% endblock %}
