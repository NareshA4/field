{% load ui_tags %}

<div id="notes-container">
  <div class="mb-3">
    {% for note in notes %}
    <div class="card mb-2 bg-light border-0">
      <div class="card-body p-2 px-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span class="small fw-bold text-primary">
            {% icon 'people' 12 %} {{ note.author.user.display_name }}
          </span>
          <span class="small text-muted">
            {{ note.created_at|date:"M j, Y H:i" }}
          </span>
        </div>
        <p class="mb-0 small text-body" style="white-space: pre-line;">{{ note.body }}</p>
      </div>
    </div>
    {% empty %}
    <p class="small text-muted italic mb-3">No technician notes recorded yet.</p>
    {% endfor %}
  </div>

  <form method="post" action="{% url 'workspace:notes' work_order.pk %}"
        hx-post="{% url 'workspace:notes' work_order.pk %}"
        hx-target="#notes-container"
        hx-swap="outerHTML">
    {% csrf_token %}
    <div class="input-group">
      <textarea name="body" class="form-control form-control-sm" rows="2" placeholder="Add an execution note..." required></textarea>
      <button class="btn btn-outline-primary btn-sm px-3" type="submit">
        {% icon 'plus' 14 %} Add Note
      </button>
    </div>
  </form>
</div>
