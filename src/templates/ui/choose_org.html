{% extends "public.html" %}
{% block content %}
<h1 class="h4 mb-3">Choose an organization</h1>
{% if choices %}
<div class="d-grid gap-2">{% for m in choices %}
  <form method="post" action="{% url 'ui:switch_org' %}">{% csrf_token %}
    <input type="hidden" name="organization" value="{{ m.organization_id }}">
    <button class="btn btn-outline-primary w-100 text-start">{{ m.organization.name }}</button></form>{% endfor %}</div>
{% else %}<p>Your account is not an active member of any organization. Contact your administrator.</p>{% endif %}
<form method="post" action="{% url 'accounts:logout' %}" class="mt-3">{% csrf_token %}<button class="btn btn-link p-0">Sign out</button></form>
{% endblock %}
