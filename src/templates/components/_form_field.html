<div class="mb-3">
  <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if field.field.widget.input_type == "checkbox" or field.field.widget.allow_multiple_selected %}{{ field }}{% else %}
  <div>{{ field }}</div>{% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
</div>
