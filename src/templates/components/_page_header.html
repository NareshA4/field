<div class="fx-page-header">
  <div>
    {% if crumbs %}<nav aria-label="breadcrumb"><ol class="breadcrumb mb-1 small">
      {% for label, url in crumbs %}{% if url %}<li class="breadcrumb-item"><a href="{{ url }}">{{ label }}</a></li>{% else %}<li class="breadcrumb-item active" aria-current="page">{{ label }}</li>{% endif %}{% endfor %}
    </ol></nav>{% endif %}
    <h1>{{ title }}</h1>
    {% if subtitle %}<div class="text-body-secondary">{{ subtitle }}</div>{% endif %}
  </div>
  <div class="d-flex gap-2 flex-wrap">{{ actions }}</div>
</div>
