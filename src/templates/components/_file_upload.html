{% comment %} Module pages include this with `upload_url` (a server endpoint using files.services.attach). Validation
   (type, size, content sniffing) is enforced server-side; the accept attribute is only a hint. {% endcomment %}
<form method="post" action="{{ upload_url }}" enctype="multipart/form-data" class="d-flex gap-2 align-items-center">{% csrf_token %}
  <input class="form-control form-control-sm" type="file" name="file" required accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.docx,.xlsx,.txt,.csv">
  <button class="btn btn-sm btn-outline-primary">Upload</button>
</form>
