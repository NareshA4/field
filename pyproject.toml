[project]
name = "fieldops-nexus"
version = "0.1.0"
description = "FieldOps Nexus - multi-tenant Enterprise Asset, Maintenance & Field Service ERP (HPE-PRD-2026-FOPS02)"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "django-filter>=24.1",
    "django-axes>=6.4",
    "django-cors-headers>=4.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "gunicorn>=22.0",
    "whitenoise>=6.6",
    "pillow>=10.3",
    "filetype>=1.2",
    "django-storages[s3]>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --reuse-db"
markers = [
    "tenant: tenant-isolation tests",
    "rbac: authorization tests",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs/blueprint", ".venv", "src/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["DJ001", "B904", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001", "UP"]
"tests/**" = ["E501"]

[tool.coverage.run]
source = ["src/apps"]
omit = ["*/migrations/*"]
