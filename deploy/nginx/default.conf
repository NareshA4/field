# Reverse proxy in front of Gunicorn. In production add `listen 443 ssl;` + certificates (TLS termination)
# and set X-Forwarded-Proto to $scheme. Static files are served by WhiteNoise inside the app container.
upstream fieldops_web { server web:8000; }

# Only credential POSTs are rate limited (page views are free). Empty key = not limited.
map $request_method $login_post_key { POST $binary_remote_addr; default ""; }
limit_req_zone $login_post_key zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=300r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    # Security headers (nosniff, referrer policy, frame options, HSTS) are set once, by Django.

    proxy_set_header Host $http_host;   # keep the port: Django's CSRF origin check compares Origin with Host
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx APPENDS the address it received the request from. Django trusts exactly TRUSTED_PROXY_COUNT hops
    # from the right of this header (see apps/core/net.py); anything a client put at the left is ignored.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;

    location = /accounts/login/ { limit_req zone=login burst=10 nodelay; proxy_pass http://fieldops_web; }
    location /api/ { limit_req zone=api burst=50 nodelay; proxy_pass http://fieldops_web; }
    location / { proxy_pass http://fieldops_web; }
}
