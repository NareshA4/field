# Docker internal DNS resolver (refreshes upstream IP every 5s)
resolver 127.0.0.11 valid=5s ipv6=off;

# Only credential POSTs are rate limited (page views are free). Empty key = not limited.
map $request_method $login_post_key { POST $binary_remote_addr; default ""; }
limit_req_zone $login_post_key zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=300r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    # Preserve Host, IP, and Request ID
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;

    # Dynamic backend resolution prevents 502 Bad Gateway on container recreation
    set $backend "http://web:8000";

    location = /accounts/login/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass $backend;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass $backend;
    }

    location / {
        proxy_pass $backend;
    }
}
