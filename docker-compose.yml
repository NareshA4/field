# Local / staging stack. Secrets come from .env (never committed): run `python scripts/bootstrap_env.py` first.
x-app: &app
  build: .
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DATABASE_URL: postgres://${POSTGRES_USER:-fieldops}:${POSTGRES_PASSWORD:-fieldops}@db:5432/${POSTGRES_DB:-fieldops}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    DJANGO_SECURE_SSL_REDIRECT: "false"
    DJANGO_SECURE_COOKIES: "false"
    TRUSTED_PROXY_COUNT: "1"
    SITE_BASE_URL: http://localhost:${NGINX_PORT:-8080}
    DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${NGINX_PORT:-8080},http://127.0.0.1:${NGINX_PORT:-8080},http://localhost:8000,http://127.0.0.1:8000
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  volumes:
    - media:/app/media
    - ./src:/app/src

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fieldops}
      POSTGRES_USER: ${POSTGRES_USER:-fieldops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldops}
    ports:
      - "5432:5432"
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fieldops} -d ${POSTGRES_DB:-fieldops}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10}
  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    restart: "no"
  web:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    <<: *app
    command: celery -A config worker -l info
    healthcheck: {test: ["CMD-SHELL", "celery -A config inspect ping -t 5 >/dev/null 2>&1 || exit 1"], interval: 60s, timeout: 15s, retries: 3, start_period: 20s}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      db: {condition: service_healthy}
  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      db: {condition: service_healthy}
  nginx:
    build: ./deploy/nginx
    ports: ["${NGINX_PORT:-8080}:80"]
    depends_on: [web]

volumes:
  pgdata:
  media:
