# Render Blueprint: FieldOps Nexus on Render FREE (one web service running web + Celery worker + embedded beat).
# See docs/DEPLOYMENT.md "Render Free architecture". No secrets here: `sync: false` values are set in the Render dashboard / API only.
# Redis: existing Key Value `fieldops-nexus-redis` (internal URL). Database: Supabase `fieldops` schema via the session pooler.
services:
  - type: web
    name: fieldops-nexus-web
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /health/live/
    dockerCommand: python scripts/render_start.py
    envVars:
      - {key: DJANGO_SETTINGS_MODULE, value: config.settings.prod}
      - {key: DJANGO_DEBUG, value: "false"}
      - {key: RUN_MIGRATIONS_ON_START, value: "true"}
      - {key: DJANGO_SECRET_KEY, sync: false}
      - {key: DATABASE_URL, sync: false}
      - {key: REDIS_URL, sync: false}
      - {key: CELERY_BROKER_URL, sync: false}
      - {key: DJANGO_ALLOWED_HOSTS, sync: false}
      - {key: DJANGO_CSRF_TRUSTED_ORIGINS, sync: false}
      - {key: SITE_BASE_URL, sync: false}
      - {key: EMAIL_BACKEND, value: django.core.mail.backends.smtp.EmailBackend}
      - {key: EMAIL_HOST, value: smtp-relay.brevo.com}
      - {key: EMAIL_PORT, value: "2525"}   # Render Free blocks outbound 25/465/587; Brevo also listens on 2525
      - {key: EMAIL_USE_TLS, value: "true"}
      - {key: EMAIL_HOST_USER, sync: false}
      - {key: EMAIL_HOST_PASSWORD, sync: false}
      - {key: DEFAULT_FROM_EMAIL, sync: false}
      - {key: TRUSTED_PROXY_COUNT, value: "1"}
