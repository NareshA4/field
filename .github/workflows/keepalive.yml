# Keeps the Render FREE web service awake (it sleeps after ~15 min without HTTP traffic), so the embedded Celery worker/beat
# (SLA monitor, PM generation, renewal alerts, emails) keeps running. Pings the public liveness endpoint every 5 minutes.
# GitHub may delay scheduled runs and disables schedules after 60 days without repository activity.
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping liveness endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://fieldops-nexus-web.onrender.com/health/live/ || true)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
