name: CI
on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: fieldops, POSTGRES_PASSWORD: ci_only_password, POSTGRES_DB: fieldops}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldops" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://fieldops:ci_only_password@localhost:5432/fieldops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.lock pytest pytest-django pytest-cov ruff
      - name: Lint
        run: ruff check src tests manage.py
      - name: Migrations are in sync and apply to a fresh DB
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Deployment check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-generated-${{ github.run_id }}-${{ github.sha }}-not-a-real-secret-0123456789
        run: python manage.py check --deploy --fail-level ERROR
      - name: Tests
        run: pytest --cov=src/apps --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.xml}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.lock
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fieldops-nexus:ci .
