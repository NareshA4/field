name: CI Pipeline

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-format:
    name: Lint, Formatting & Import Order
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Lint and import order with ruff
        run: ruff check src tests manage.py scripts

      - name: Check code formatting with ruff
        run: ruff format --check src tests manage.py scripts

      - name: Security scan with bandit
        run: bandit -r src -ll --skip B101,B104,B311

  migrate-check:
    name: Migrations in sync
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: fieldops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldops" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://fieldops:ci_only_password@localhost:5432/fieldops
      DJANGO_SECRET_KEY: ci-generated-${{ github.run_id }}-${{ github.sha }}-not-a-real-secret-0123456789
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Dry-run migrations are in sync
        run: python manage.py makemigrations --check --dry-run

      - name: Deploy settings check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
        run: python manage.py check --deploy --fail-level ERROR

  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: [lint-format, migrate-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: fieldops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldops" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://fieldops:ci_only_password@localhost:5432/fieldops
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-generated-${{ github.run_id }}-${{ github.sha }}-not-a-real-secret-0123456789
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock pytest pytest-django pytest-cov

      - name: Run test suite with coverage
        run: pytest --cov=src/apps --cov-report=term-missing --cov-report=xml -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    needs: [lint-format]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.lock

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint-format]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fieldops-nexus:ci .
